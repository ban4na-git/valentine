<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: system-ui, Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    overflow: hidden;
}

.container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

h1 {
    color: white;
    font-size: clamp(24px, 5vw, 42px);
    margin: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.gif {
    width: min(220px, 60vw);
    border-radius: 20px;
    margin: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.buttons {
    position: relative;
    width: 260px;
    height: 80px;
    margin-top: 10px;
}

button {
    position: absolute;
    width: 80px;
    height: 44px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* COLORS SWAPPED */
#yes {
    left: 0;
    background: #ff4d6d;
    color: white;
}

#no {
    right: 0;
    background: white;
    color: #ff4d6d;
}

.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 0.7; }
    to   { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>
<div class="container" id="main">
    <!-- FIRST PAGE GIF -->
    <img class="gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

    <h1>Will you be my Valentine? ❤️</h1>

    <div class="buttons" id="buttonArea">
        <button id="yes">Yes 😊</button>
        <button id="no">No 😏</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const area  = document.getElementById("buttonArea");

let x = area.clientWidth - 110;
let y = 0;

document.addEventListener("mousemove", e => {
    const rect = noBtn.getBoundingClientRect();

    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;

    const dx = e.clientX - cx;
    const dy = e.clientY - cy;

    const distance = Math.sqrt(dx*dx + dy*dy);
    const repelRadius = 225;

    if (distance < repelRadius) {
        const angle = Math.atan2(dy, dx);
        const force = (repelRadius - distance) / repelRadius;
        const strength = 1;

        x -= Math.cos(angle) * strength * force * 6;
        y -= Math.sin(angle) * strength * force * 6;

        /* BIGGER MOVEMENT ZONE */
        const maxX = area.clientWidth + 120;
        const minX = -300;
        const maxY = 120;
        const minY = -200;

        x = Math.max(minX, Math.min(maxX, x));
        y = Math.max(minY, Math.min(maxY, y));

        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
});

document.getElementById("yes").onclick = () => {
    document.body.innerHTML = `
        <div class="container">
            <img class="gif" src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif">
            <h1>Best choice ever ❤️😂</h1>
            <div style="font-size:80px">🥰💘🎉</div>
        </div>`;
};

function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top  = (window.innerHeight + 20) + "px";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}

setInterval(spawnHeart, 300);
</script>
</body>
</html>
