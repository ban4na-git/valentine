<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question ❤️</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
        animation: bgPulse 6s infinite alternate;
        padding: 20px;
        box-sizing: border-box;
    }

    @keyframes bgPulse {
        from { filter: brightness(1); }
        to { filter: brightness(1.15); }
    }

    h1 {
        font-size: clamp(1.8em, 5vw, 2.5em);
        color: #fff;
        margin: 15px 0;
        min-height: 60px;
    }

    .btn {
        font-size: 1.2em;
        padding: 14px 28px;
        margin: 10px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease;
        touch-action: manipulation;
    }

    #yesBtn {
        background-color: #28a745;
        color: white;
    }

    #yesBtn:hover {
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #dc3545;
        color: white;
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
    }

    .gif {
        width: min(220px, 60vw);
        border-radius: 20px;
        margin: 10px 0;
    }

    .heart {
        position: fixed;
        bottom: -20px;
        animation: floatUp linear forwards;
        pointer-events: none;
    }

    @keyframes floatUp {
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<img class="gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute gif">

<h1 id="question"></h1>

<img class="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Funny gif">

<button id="yesBtn" class="btn">Yes 💖</button>
<button id="noBtn" class="btn">No 💔</button>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b05d9c2b.mp3?filename=romantic-background-112191.mp3" type="audio/mpeg">
</audio>

<script>
const question = document.getElementById("question");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const audio = document.getElementById("bgMusic");


// ---------- Typewriter Effect ----------
const text = "Will you be my Valentine? ❤️";
let index = 0;

(function typeWriter() {
    if (index < text.length) {
        question.textContent += text[index++];
        setTimeout(typeWriter, 60);
    }
})();


// ---------- No Button Behavior ----------
let noScale = 1;
let tries = 0;

function moveNoButton() {
    tries++;

    const rect = noBtn.getBoundingClientRect();
    const padding = 20;

    const maxX = window.innerWidth - rect.width - padding;
    const maxY = window.innerHeight - rect.height - padding;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    noScale = Math.max(0.4, noScale - 0.07);
    noBtn.style.transform = `scale(${noScale})`;

    if (tries > 6) noBtn.textContent = "You sure? 😭";
    if (tries > 10) noBtn.textContent = "Okay fine 😔";
}

noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);


// ---------- Yes Button ----------
yesBtn.addEventListener("click", () => {
    audio.play().catch(() => {});

    const overlay = document.createElement("div");
    overlay.style.cssText = `
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg,#ff9a9e,#fad0c4);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.6s ease;
        z-index: 9999;
        text-align: center;
        color: white;
    `;

    overlay.innerHTML = `
        <h1>Best decision ever 🥰💘</h1>
        <img class="gif" src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif">
        <img class="gif" src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif">
    `;

    document.body.appendChild(overlay);

    for (let i = 0; i < 120; i++) {
        const heart = document.createElement("span");
        heart.textContent = "💖";
        heart.style.cssText = `
            position: fixed;
            left: ${Math.random() * 100}vw;
            top: ${Math.random() * 100}vh;
            font-size: ${16 + Math.random() * 30}px;
            animation: floatUp 2s ease-out forwards;
        `;
        overlay.appendChild(heart);
    }
});


// ---------- Floating Hearts Background ----------
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    heart.style.animationDuration = (3 + Math.random() * 2) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 600);


// ---------- Reduced Motion Support ----------
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.body.style.animation = "none";
}
</script>

</body>
</html>
