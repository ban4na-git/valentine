<script>
    const noBtn = document.getElementById("noBtn");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let velocityX = 0;
    let velocityY = 0;

    const repelRadius = 140;      // how close cursor can get
    const repelStrength = 0.25;   // panic intensity
    const friction = 0.85;        // smoothness

    document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateNoButton() {
        const rect = noBtn.getBoundingClientRect();

        const btnX = rect.left;
        const btnY = rect.top;

        const dx = btnX - mouseX;
        const dy = btnY - mouseY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < repelRadius) {
            const force = (repelRadius - distance) * repelStrength;

            velocityX += (dx / distance) * force;
            velocityY += (dy / distance) * force;
        }

        velocityX *= friction;
        velocityY *= friction;

        let newX = btnX + velocityX;
        let newY = btnY + velocityY;

        const maxX = window.innerWidth - rect.width;
        const maxY = window.innerHeight - rect.height;

        newX = Math.max(0, Math.min(maxX, newX));
        newY = Math.max(0, Math.min(maxY, newY));

        noBtn.style.position = "fixed";
        noBtn.style.left = newX + "px";
        noBtn.style.top = newY + "px";

        requestAnimationFrame(animateNoButton);
    }

    animateNoButton();

    // Typewriter effect (UNCHANGED BEHAVIOR)
    const text = "Will you be my Valentine? ❤️";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("question").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 60);
        }
    }
    typeWriter();

    function sayYes() {
        for (let i = 0; i < 80; i++) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = "2s";
            heart.style.fontSize = "20px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        setTimeout(() => {
            document.body.innerHTML = `
                <h1 style="color:white;">Best decision ever 🥰💘</h1>
                <img class="gif" src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif">
                <img class="gif" src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif">
            `;
        }, 500);
    }

    // Floating hearts (UNCHANGED)
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 2) + "s";
        heart.style.fontSize = (16 + Math.random() * 24) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
</script>
