<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
        animation: bgPulse 6s infinite alternate;
        padding: 20px;
        box-sizing: border-box;
    }

    @keyframes bgPulse {
        from { filter: brightness(1); }
        to { filter: brightness(1.15); }
    }

    h1 {
        font-size: clamp(1.8em, 5vw, 2.5em);
        color: #fff;
        margin: 15px 0;
        z-index: 1;
        min-height: 60px;
    }

    .btn {
        font-size: 1.2em;
        padding: 14px 28px;
        margin: 10px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease;
        z-index: 1;
        touch-action: manipulation;
    }

    #yesBtn {
        background-color: #28a745;
        color: white;
    }

    #yesBtn:hover {
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #dc3545;
        color: white;
        position: fixed;
    }

    .gif {
        width: min(220px, 60vw);
        border-radius: 20px;
        margin: 10px 0;
        z-index: 1;
    }

    .heart {
        position: fixed;
        bottom: -20px;
        animation: floatUp linear forwards;
        pointer-events: none;
    }

    @keyframes floatUp {
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<img class="gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="cute gif">

<h1 id="question"></h1>

<img class="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="funny gif">

<button id="yesBtn" class="btn" onclick="sayYes()">Yes 💖</button>
<button id="noBtn" class="btn">No 💔</button>

<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b05d9c2b.mp3?filename=romantic-background-112191.mp3" type="audio/mpeg">
</audio>

<script>
    const noBtn = document.getElementById("noBtn");

    // Typewriter question
    const text = "Will you be my Valentine? ❤️";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("question").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 60);
        }
    }
    typeWriter();

    // No button movement (controlled area)
    let noScale = 1;
    function moveNoButton() {
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const marginX = window.innerWidth * 0.15;
        const marginY = window.innerHeight * 0.2;

        const maxX = window.innerWidth - btnWidth - marginX;
        const maxY = window.innerHeight - btnHeight - marginY;

        const minX = marginX / 2;
        const minY = marginY / 2;

        const x = Math.random() * (maxX - minX) + minX;
        const y = Math.random() * (maxY - minY) + minY;

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        noScale -= 0.08;
        noBtn.style.transform = `scale(${noScale})`;

        if (noScale <= 0.3) {
            noBtn.innerText = "okay fine 😭";
        }
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    function sayYes() {
        for (let i = 0; i < 80; i++) {
            const conf = document.createElement("div");
            conf.innerHTML = "💖";
            conf.style.position = "fixed";
            conf.style.left = Math.random() * 100 + "vw";
            conf.style.top = Math.random() * 100 + "vh";
            conf.style.fontSize = "20px";
            conf.style.animation = "floatUp 2s ease-out forwards";
            document.body.appendChild(conf);
        }

        setTimeout(() => {
            document.body.innerHTML = `
                <h1 style="color:white; padding:20px;">Best decision ever 🥰💘</h1>
                <img class="gif" src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif">
                <img class="gif" src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif">
            `;
        }, 800);
    }

    // Floating hearts background
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 2) + "s";
        heart.style.fontSize = (16 + Math.random() * 24) + "px";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
</script>

</body>
</html>
