<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: system-ui, Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    overflow: hidden;
}

.container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

h1 {
    color: white;
    font-size: clamp(24px, 5vw, 42px);
    margin: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.gif {
    width: min(220px, 60vw);
    border-radius: 20px;
    margin: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.buttons {
    position: relative;
    width: 260px;
    height: 140px; /* VIRTUAL CAGE HEIGHT */
    margin-top: 10px;
}

button {
    position: absolute;
    width: 80px;
    height: 44px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* COLORS SWAPPED */
#yes {
    left: 0;
    background: #ff4d6d;
    color: white;
}

#no {
    left: 0;          /* remove right bias */
    top: 0;
    background: white;
    color: #ff4d6d;
}

.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 0.7; }
    to   { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>
<div class="container" id="main">
    <img class="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2JlZTYzMG90cHRnejhjdzN0MjR2cHcwcTRhaGxkdjQ3OXo1aWQ0NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8QbwUh40Hl96yMgvOx/giphy.gif">
    <h1>Douda, will you be my Valentine? ❤️</h1>

    <div class="buttons" id="buttonArea">
        <button id="yes">Yes 😊</button>
        <button id="no">No 😏</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const area  = document.getElementById("buttonArea");
const btnWidth = noBtn.offsetWidth;
const btnHeight = noBtn.offsetHeight;

let x = area.clientWidth - btnWidth;
let y = 0;

const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function repel(targetX, targetY) {
    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;

    const dx = targetX - cx;
    const dy = targetY - cy;

    const distance = Math.sqrt(dx*dx + dy*dy);
    const repelRadius = 200;

    if (distance < repelRadius) {
        const angle = Math.atan2(dy, dx);
        const force = Math.pow((repelRadius - distance) / repelRadius, 2);
        const strength = 2;

        const jitterX = (Math.random() - 0.5) * 6;
        const jitterY = (Math.random() - 0.5) * 6;

        x -= Math.cos(angle) * strength * force * 6 + jitterX;
        y -= Math.sin(angle) * strength * force * 6 + jitterY;

        const maxX = window.innerWidth - btnWidth;
        const minX = -400;
        const maxY = window.innerHeight - btnHeight;
        const minY = -400;

        x = clamp(x, minX, maxX);
        y = clamp(y, minY, maxY);

        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
}

if (!isTouchDevice) {
    document.addEventListener("mousemove", e => repel(e.clientX, e.clientY));
}

/* MOBILE: JUMP INSIDE CAGE */
function jumpInsideCage() {
    const maxX = area.clientWidth  - btnWidth - 100;
    const maxY = area.clientHeight - btnHeight;

    const newX = Math.random() * maxX - 100;
    const newY = Math.random() * maxY - 50;

    noBtn.style.left = newX + "px";
    noBtn.style.top  = newY + "px";

    const wiggleX = (Math.random() - 0.1) * 10;
    const wiggleY = (Math.random() - 0.1) * 10;
    const rotate  = (Math.random() - 0.5) * 20;
    const scale   = 0.9 + Math.random() * 0.1;

    noBtn.style.transform =
        `translate(${x + wiggleX}px, ${y + wiggleY}px)
         rotate(${rotate}deg)
         scale(${scale})`;
}

if (isTouchDevice) {
    noBtn.addEventListener("touchstart", e => {
        jumpInsideCage();
        e.preventDefault();
    }, {passive:false});
}

document.getElementById("yes").onclick = () => {
    document.body.innerHTML = `
        <div class="container">
            <img class="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDNyanV2NWVmc29iZWg2bXh0ZGhxM3RhMHIwNnhveHk2aDB2Mml6ZyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/31lPv5L3aIvTi/giphy.gif">
            <h1>Yeeeey, rbaht maana l 3asba ❤️</h1>
            <div style="font-size:80px">🎉</div>
        </div>`;
};

function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top  = (window.innerHeight + 20) + "px";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}

setInterval(spawnHeart, 300);
</script>
</body>
</html>
